<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cabinet">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Skincare Cabinet Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a phone-sized app (bottom tabs: Cabinet, Add, Use First, Before You Buy) inside a slim testing bar. Cream ground, white rows with a pastel tile per product type, big thumbnail on the left and a chevron on the right; bottles are drawn per category and filled to the remaining quantity. */
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --card:#E3EFE5; --ink:#2A3330; --muted:#6C776F;
  --accent:#A9D3B8; --accent-ink:#23382C; --accent-fg:#3C7255; --line:#E9E3D8;
  --warn:#7A5410; --warn-bg:#FCEFCB; --bad:#A24540; --bad-bg:#FADCD8; --ok:#35704D; --ok-bg:#DDF0E1;
  --shadow:0 14px 40px rgba(90,75,50,.14);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --in:0px;
  /* liquid tints for the product illustrations, mid-tone so they read on both themes */
  --l1:#8FC3A0; --l2:#E3A596; --l3:#E6C677; --l4:#8DBBDB; --l5:#BCAEE0;
  /* pastel tiles behind each product type: sage, blush, butter, sky, lilac */
  --p1:#E2F0E5; --p2:#F9E2DC; --p3:#FBF0D2; --p4:#DDEBF6; --p5:#E9E2F6;
}
:root[data-theme="dark"]{
  --bg:#171512; --surface:#221F1B; --card:#28342C; --ink:#EEE9DF; --muted:#A8A196;
  --accent:#A9D3B8; --accent-ink:#1E3025; --accent-fg:#B7DEC5; --line:#36322C;
  --warn:#EBC983; --warn-bg:#3D3220; --bad:#F0A9A2; --bad-bg:#432724; --ok:#A5D8B4; --ok-bg:#223829;
  --p1:#2B382F; --p2:#3B2D29; --p3:#3A3421; --p4:#27343F; --p5:#322D40;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.bt{display:block;color:var(--ink);height:100%;width:auto;max-width:100%}

.stage{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;max-width:440px;margin:0 auto}
.protobar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.protobar b{color:var(--ink);font-weight:600}
.pb-r{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.facbtn{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}

.phone{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.screen{flex:1;min-height:0;overflow-y:auto;padding:6px var(--in) 20px;display:flex;flex-direction:column;gap:16px}
@media (min-width:640px){
  :root{--in:18px}
  .stage{max-height:900px}
  .phone{border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);background:var(--bg)}
  .screen{padding-top:18px}
}

/* type */
h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.01em;text-wrap:balance}
.sub,.muted{color:var(--muted)}
.sub{margin-top:4px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head>div{min-width:0}
.bhead{display:flex;align-items:center;gap:6px;margin-left:-8px}
.bhead h2{font-size:17px}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px}
.iconbtn:hover{background:var(--card)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;text-align:center}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.small svg.i{width:18px;height:18px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.link{color:var(--accent-fg);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* hub tiles */
.hub{display:flex;flex-direction:column;gap:12px;width:100%;background:var(--card);border-radius:20px;padding:16px}
.hub-top{display:flex;align-items:center;gap:12px}
.hub-top svg.i{color:var(--accent-fg);width:26px;height:26px}
.hub-top b{font-family:var(--f-display);font-size:18px;font-weight:600}
.hub-top .count{margin-left:auto;font-weight:600;font-size:13px;background:var(--surface);border-radius:999px;padding:4px 10px}
.hub-list{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.hub-row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hub-row span:first-child{min-width:0;overflow-wrap:anywhere}
.hub-row span:last-child{color:var(--muted);white-space:nowrap}
.hub.tile{flex-direction:row;align-items:center;background:var(--p5)}
.hub.tile .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.hub.tile .t span{color:var(--muted);font-size:14px}
.hub.tile svg.i{color:var(--accent-fg);width:26px;height:26px}
.hub .arrow{margin-left:auto;color:var(--muted)}
.hbar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface)}
.hbar i{display:block;min-width:0}
.hbar .s-bad{background:var(--bad)}.hbar .s-warn{background:var(--warn)}.hbar .s-nd{background:var(--muted);opacity:.55}.hbar .s-ok{background:var(--accent-fg);opacity:.55}
.hleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:-4px}
.hleg span{display:inline-flex;align-items:center;gap:5px}
.hleg i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* products */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:46px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;padding:10px 0}
.search svg.i{color:var(--muted);width:20px;height:20px}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;background:var(--surface)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sec{display:flex;flex-direction:column;gap:10px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vt{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.vt button{display:flex;align-items:center;gap:6px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.vt button svg.i{width:16px;height:16px}
.vt button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:0;border-radius:18px;padding:8px 14px 8px 8px}
.thumb{width:64px;height:64px;flex:none;background:var(--p1);border-radius:16px;display:grid;place-items:center}
.thumb svg.bt{height:50px}
.prow .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.prow .m b{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.prow .m span{color:var(--muted);font-size:14px}
.prow .m span.warn{color:var(--warn)}.prow .m span.bad{color:var(--bad)}
.prow .chev{color:var(--muted);flex:none;display:grid}
.prow .chev svg.i{width:20px;height:20px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.op{background:var(--card);color:var(--accent-fg);border-color:transparent}
.bar{width:64px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{color:var(--muted);padding:18px 4px}
/* shelf view */
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 8px 6px;row-gap:6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;text-align:center;min-width:0;border-radius:10px}
.slot{position:relative;width:100%;height:86px;padding:0 6px;display:flex;align-items:flex-end;justify-content:center;border-bottom:5px solid var(--card)}
.slot svg.bt{height:78px;margin-bottom:0}
.dot{position:absolute;top:2px;right:8px;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.cell .nm{font-size:12px;line-height:1.2;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding:0 2px 8px;min-height:2.6em}
.shelf-leg{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.shelf-leg span{display:inline-flex;align-items:center;gap:5px}
.shelf-leg i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* use first */
.item{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.item-main{display:flex;gap:12px;width:100%;align-items:flex-start}
.item-main .thumb{margin-top:2px}
.item-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-top>div{display:flex;flex-direction:column;min-width:0}
.item-top b{font-weight:600;overflow-wrap:anywhere}
.item-top span.muted{font-size:13px}
.dateline{font-family:var(--f-display);font-weight:600;font-size:17px}
.src{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.why{color:var(--muted);font-size:14px}
.chip{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.nd{background:var(--card);color:var(--muted)}
.foot{font-size:13px;color:var(--muted);padding:2px 2px 8px}

/* add */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:18px;padding:16px}
.opt svg.i{width:28px;height:28px;color:var(--accent-fg)}
.opt div{display:flex;flex-direction:column;gap:1px;min-width:0}
.opt b{font-family:var(--f-display);font-size:17px;font-weight:600}
.opt span{color:var(--muted);font-size:14px}
.opt .arrow{margin-left:auto;color:var(--muted)}
.note{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px}
.note.nf{background:var(--warn-bg);color:var(--warn)}
.addhero{display:flex;justify-content:center;align-items:flex-end;gap:14px;height:92px;padding:10px 0 0;border-bottom:5px solid var(--card)}
.addhero svg.bt{height:78px;width:auto}
.addhero svg.bt:nth-child(2n){height:64px}
.addhero svg.bt:nth-child(3n){height:70px}

/* form */
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input[type="text"],.field input[type="date"],.field select{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font-size:16px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.field.unsure input{border-color:var(--warn);background:var(--warn-bg)}
.hint{font-size:13px;color:var(--warn);font-weight:500}
.err{font-size:13px;color:var(--bad);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.row2{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{min-height:44px;text-align:center;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.actions{display:flex;flex-direction:column;gap:8px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:12px;font-weight:600;text-align:center;min-width:0}
.cat .ci{height:40px;display:flex;align-items:flex-end}
.cat .ci svg.bt{height:40px}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--card);box-shadow:inset 0 0 0 1px var(--accent)}

/* details */
.hero{display:flex;gap:16px;align-items:flex-end}
.hero .hb{flex:none;width:76px;height:100px;background:var(--card);border-radius:20px;display:grid;place-items:center;padding:10px 0}
.hero .hb svg.bt{height:80px}
.hero>div:last-child{min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding-bottom:2px}
.hero h1{font-size:26px;overflow-wrap:anywhere}
.datebox{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px}
.datebox .big{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em}
.datebox p{font-size:14px;color:var(--muted)}
.datebox .tag{align-self:flex-start;background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.track{position:relative;height:8px;border-radius:99px;background:var(--line);margin:12px 8px 6px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-fg);opacity:.45;border-radius:99px}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px}
.g-opened{border:2px solid var(--muted);background:var(--surface);border-radius:50%}
.g-today{width:18px;height:18px;background:var(--accent-fg);border:3px solid var(--surface);border-radius:50%;box-shadow:0 0 0 1px var(--accent-fg)}
.g-pao{background:var(--ink);border-radius:3px}
.g-printed{background:var(--warn);transform:translate(-50%,-50%) rotate(45deg);border-radius:2px}
.tl-rows{display:flex;flex-direction:column}
.tl-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tl-row:first-child{border-top:0}
.tl-row .gl{position:relative;width:16px;height:16px;flex:none}
.tl-row .gl .mk{left:50%}
.tl-row .gl .g-today{width:14px;height:14px}
.tl-row .lb{flex:1;min-width:0}
.tl-row .lb span{display:block;color:var(--muted);font-size:12px}
.tl-row .dt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-row .dt .chip{display:inline-block;margin-top:2px}
.facts{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.facts li:first-child{border-top:0}
.facts li span:first-child{color:var(--muted)}
.facts li span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.qty{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.qty-top{display:flex;justify-content:space-between;align-items:baseline}
.qty-top b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.qty input[type="range"]{width:100%;accent-color:var(--accent);height:32px}
.confirm{background:var(--bad-bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{font-weight:600;color:var(--bad)}
.confirm div{display:flex;gap:8px}
.confirm .btn{flex:1}

/* buy */
.try{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.try .fchip{background:var(--surface)}
.sbar{display:flex;gap:8px}
.sbar .search{flex:1;min-width:0}
.sbar .iconbtn{border:1px solid var(--line);background:var(--surface);width:46px;height:46px;flex:none;color:var(--accent-fg)}
.res{display:flex;flex-direction:column;gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rcard.exact{background:var(--card);border-color:transparent}
.rbadge{align-self:flex-start;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--accent-fg)}
.rcard.sim .rbadge{background:var(--warn-bg);color:var(--warn)}
.rcard.none .rbadge{background:var(--card);color:var(--muted)}
.rcard h3{font-family:var(--f-display);font-size:20px;font-weight:600;overflow-wrap:anywhere}
.rcard .own{font-weight:600}
.units{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;background:var(--surface);border-radius:16px;padding:12px 14px 0;border-bottom:0}
.unit{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;text-align:center}
.unit .ub{height:76px;display:flex;align-items:flex-end;width:100%;justify-content:center;border-bottom:5px solid var(--card)}
.unit .ub svg.bt{height:72px}
.unit span{font-size:12px;line-height:1.25;padding-bottom:10px}
.unit span b{display:block;font-weight:600}
.unit span em{font-style:normal;color:var(--muted)}
.simrow{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.simrow:first-of-type{border-top:0;padding-top:0}
.simrow .thumb{width:52px;height:52px}.simrow .thumb svg.bt{height:40px}
.simrow div.m{display:flex;flex-direction:column;min-width:0;flex:1}
.simrow b{font-weight:600;overflow-wrap:anywhere}
.simrow span{font-size:13px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 140px}
.nonebox{display:flex;gap:14px;align-items:center}
.nonebox .thumb{width:52px;height:64px;opacity:.7}
.wl{display:flex;flex-wrap:wrap;gap:8px}
.wl .w{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 13px;font-size:14px}
.wl .w button{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:var(--muted)}
.wl .w button:hover{background:var(--card)}
.wl svg.i{width:14px;height:14px}

/* nav */
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px 4px 8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;border-radius:12px;min-width:0}
.nav button span.ic{display:grid;place-items:center;width:46px;height:28px;border-radius:99px}
.nav button[aria-current="page"]{color:var(--accent-fg)}
.nav button[aria-current="page"] span.ic{background:var(--card)}

/* toast, scan overlay, facilitator sheet */
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;z-index:6}
.ov{position:absolute;inset:0;background:#0A0E0B;color:#E9EEE4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:5;padding:24px;text-align:center}
.ov .frame{width:min(260px,80%);height:150px;position:relative;border-radius:10px;overflow:hidden}
.ov .frame.bc{background:repeating-linear-gradient(90deg,#E9EEE4 0 3px,transparent 3px 7px,#E9EEE4 7px 8px,transparent 8px 14px,#E9EEE4 14px 18px,transparent 18px 22px);opacity:.88}
.ov .frame.ph{background:linear-gradient(160deg,#1F2A22,#2B3A2F);border:1px solid #3a4a3e}
.ov .frame.ph::before{content:"";position:absolute;left:50%;top:50%;width:54px;height:90px;transform:translate(-50%,-50%);background:#C9D6C5;border-radius:10px 10px 6px 6px;opacity:.85}
.ov .corners{position:absolute;width:min(280px,86%);height:170px;pointer-events:none}
.ov .corners::before,.ov .corners::after{content:"";position:absolute;width:30px;height:30px;border:3px solid #A8C8B0}
.ov .corners::before{left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.ov .corners::after{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.ov .line{position:absolute;left:0;right:0;height:2px;background:#A8C8B0;box-shadow:0 0 14px #A8C8B0;animation:sweep 1.1s ease-in-out infinite alternate}
@keyframes sweep{from{top:6%}to{top:92%}}
@media (prefers-reduced-motion:reduce){.ov .line{animation:none;top:50%}}
.ov p{font-weight:600}
.stack{position:relative;display:grid;place-items:center;width:100%}
.sheet-bd{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:7}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px 20px;z-index:8;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet .sh h2{font-size:20px}
.task{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.task p{font-size:14px}
.tctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tbtn{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;background:var(--surface)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tbtn.run{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tm{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px}
.stats{display:flex;gap:16px;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.sheet textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px;font-size:13px}
.hbwrap{display:flex;flex-direction:column;gap:8px}.hbwrap .hleg{margin-top:0}
.hero .hb{background:var(--p1)}
</style>

var DAY=864e5;
function d0(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,d.getDate());}
function diffDays(a,b){return Math.round((a-b)/DAY);}
function iso(d){return d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';}
function parseIso(v){return v?new Date(v+'T00:00:00'):null;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- date logic: printed expiry and PAO stay separate ---------- */
function paoDate(p){return (p.status==='opened'&&p.opened&&p.pao)?addMonths(p.opened,p.pao):null;}
function reviewInfo(p){
  var c=[],pd=paoDate(p);
  if(p.expiry)c.push({date:p.expiry,type:'printed'});
  if(pd)c.push({date:pd,type:'pao'});
  if(!c.length)return null;
  c.sort(function(a,b){return a.date-b.date;});
  return c[0];
}
function urgency(date){var n=diffDays(date,d0());return n<0?'bad':(n<=30?'warn':'ok');}
var ULABEL={bad:'st_past',warn:'st_soon',ok:'st_later'};
function useFirst(){
  var now=[],soon=[],nodate=[],T=d0();
  S.products.forEach(function(p){
    var i=reviewInfo(p);
    if(i){var n=diffDays(i.date,T),it={p:p,i:i,n:n};if(n<=30)now.push(it);else if(n<=120)soon.push(it);}
    else if(p.status==='opened'){nodate.push({p:p});}
  });
  now.sort(function(a,b){return a.n-b.n;});soon.sort(function(a,b){return a.n-b.n;});
  return {now:now,soon:soon,nodate:nodate};
}
function lowItems(){
  return S.products.filter(function(p){
    return p.status==='opened'&&p.left!=null&&p.left<=20&&!S.products.some(function(q){return q!==p&&q.status==='unopened'&&gkey(q)===gkey(p);});
  });
}

function subline(p){

    if(p.expiry)return {text:t('sl_expires',{d:fmt(p.expiry)}),cls:''};

/* dates on one line: opened, today, calculated PAO date and printed expiry, each with its own marker */
function timeline(p){
  var T=d0(),op=(p.status==='opened'&&p.opened)?p.opened:null,pd=paoDate(p);
  if(!pd&&!p.expiry)return '';
  var pts=[];
  if(op)pts.push({k:'opened',d:op,l:t('opened_row')});
  pts.push({k:'today',d:T,l:t('tl_today')});
  if(pd)pts.push({k:'pao',d:pd,l:t('tl_pao')});
  if(p.expiry)pts.push({k:'printed',d:p.expiry,l:t('tl_printed')});
  var ds=pts.map(function(x){return +x.d;}),mn=Math.min.apply(null,ds),mx=Math.max.apply(null,ds),span=Math.max(mx-mn,DAY);
  function pos(d){return 3+((+d-mn)/span)*94;}
  var info=reviewInfo(p);
  var markers=pts.map(function(x){return '<span class="mk g-'+x.k+'" style="left:'+pos(x.d).toFixed(1)+'%"></span>';}).join('');
  var fill='<span class="fill" style="width:'+Math.max(0,Math.min(100,pos(T))).toFixed(1)+'%"></span>';
  var rows=pts.slice().sort(function(a,b){return a.d-b.d;}).map(function(x){
    var isReview=info&&x.k===info.type&&x.k!=='opened'&&x.k!=='today';
    return '<li class="tl-row"><span class="gl"><span class="mk g-'+x.k+'"></span></span><div class="lb">'+x.l+'<span>'+rel(x.d)+'</span></div><div class="dt">'+fmt(x.d)+(isReview?'<br><span class="chip '+urgency(x.d)+'">'+t('review_by')+'</span>':'')+'</div></li>';
  }).join('');
  return '<section class="tl"><span class="eyebrow">'+t('tl_title')+'</span><div class="track" aria-hidden="true">'+fill+markers+'</div><ul class="tl-rows">'+rows+'</ul></section>';
}

  var facts='<ul class="facts">'+
    '<li><span>'+t('purchased')+'</span><span>'+(p.purchased?fmt(p.purchased):t('not_set'))+'</span></li>'+
    '<li><span>'+t('opened_row')+'</span><span>'+(p.status==='opened'?(p.opened?fmt(p.opened):t('not_set')):t('not_opened'))+'</span></li>'+
    '<li><span>'+t('pao_row')+'</span><span>'+(p.pao?p.pao+'M':t('not_set'))+'</span></li>'+
    '<li><span>'+t('printed_row')+'</span><span>'+(p.expiry?fmt(p.expiry):t('not_set'))+'</span></li></ul>';
  var lv=p.left==null?100:p.left;
  var qty=(p.status==='opened')?'<div class="qty"><div class="qty-top"><span class="lbl">'+t('remaining')+'</span><b id="rngv">'+lv+'%</b></div>'+
    '<input type="range" id="rng" min="0" max="100" step="5" value="'+lv+'" aria-label="'+t('remaining')+'"></div>':'';
  var fin=S.confirmFinish?'<div class="confirm"><p>'+t('finish_q')+'</p><div><button class="btn" data-a="dofinish">'+t('yes_finish')+'</button><button class="btn ghost" data-a="cancelfinish">'+t('cancel')+'</button></div></div>':
    '<div class="actions"><button class="btn ghost block" data-a="edit" data-id="'+p.id+'">'+ic('pencil')+t('edit')+'</button><button class="btn ghost block" data-a="finish">'+ic('x')+t('finish')+'</button></div>';
  return backHead('')+
    '<div class="hero"><div class="hb" id="hb" style="background:'+tint(p.cat)+'">'+bottle(p.cat,p.status==='opened'?lv:100)+'</div><div><h1>'+esc(p.name)+'</h1><p class="sub" style="margin:0">'+esc(p.brand)+(p.size?' · '+esc(p.size):'')+' · '+t('cat_'+(p.cat||'other'))+'</p>'+pstatus(p)+'</div></div>'+
    box+timeline(p)+qty+facts+fin+
    '<button class="link" data-a="buyagain" style="text-align:center;padding:4px 0">'+t('buy_again')+'</button>';
}

/* ---------- before you buy ---------- */
function groups(){
  var m={},order=[];
  S.products.forEach(function(p){var k=gkey(p);if(!m[k]){m[k]={name:p.name,brand:p.brand,items:[]};order.push(k);}m[k].items.push(p);});
  return order.map(function(k){return m[k];});
}
function runSearch(q){
  var nq=norm(q),toks=nq.split(/\s+/).filter(function(w){return w.length>3;}),exact=[],similar=[];
  if(nq.length<3)return null;
  groups().forEach(function(g){
    var n=norm(g.name),full=norm(g.brand+' '+g.name);
    if(nq===n||nq===full){exact.push(g);return;}
    var need=Math.min(2,toks.length),hits=toks.filter(function(w){return n.indexOf(w)>-1;}).length;
    if(need>0&&hits>=need)similar.push(g);
  });
  return {exact:exact,similar:similar};
}
function wishBtn(name){
  var has=S.wish.indexOf(name)>-1;
  return '<button class="btn ghost" data-a="wish" data-n="'+esc(name)+'"'+(has?' disabled':'')+'>'+(has?t('wish_in'):t('wish_add'))+'</button>';
}
function resHTML(){
  var q=S.buy.q.trim(),r=runSearch(q);
  if(!r)return '<p class="empty">'+t('type_hint')+'</p>';
  var out='';
  r.exact.forEach(function(g){
    var first=g.items.filter(function(p){return p.status==='opened';})[0]||g.items[0];
    var units=g.items.slice().sort(function(a,b){return (a.status==='opened'?0:1)-(b.status==='opened'?0:1);}).map(function(p){
      var lbl=p.status==='opened'?'<b>'+t('opened')+'</b><em>'+t('left',{n:p.left==null?100:p.left})+'</em>':'<b>'+t('unopened')+'</b>';
      return '<div class="unit"><div class="ub">'+bottle(p.cat,p.status==='opened'?p.left:100)+'</div><span>'+lbl+'</span></div>';
    }).join('');
    out+='<div class="rcard exact"><span class="rbadge">'+t('exact')+'</span><h3>'+esc(g.name)+'</h3><p class="muted" style="margin-top:-8px">'+esc(g.brand)+(first.size?' · '+esc(first.size):'')+'</p>'+
      '<p class="own">'+t('own_this')+'</p><div class="units">'+units+'</div><p class="muted">'+t('check_first')+'</p>'+
      '<div class="btns"><button class="btn" data-a="open" data-id="'+first.id+'">'+t('view_cabinet')+'</button>'+wishBtn(g.name)+'</div></div>';
  });
  if(r.similar.length){
    out+='<div class="rcard sim"><span class="rbadge">'+t('similar')+'</span>'+r.similar.map(function(g){
      var f=g.items[0];
      return '<div class="simrow">'+thumb(f)+'<div class="m"><b>'+esc(g.name)+'</b><span>'+esc(g.brand)+(f.size?' · '+esc(f.size):'')+'</span></div><button class="btn small ghost" data-a="open" data-id="'+f.id+'">'+t('view')+'</button></div>';
    }).join('')+'<p class="muted">'+t('similar_note')+'</p>'+(r.exact.length?'':'<div class="btns">'+wishBtn(q)+'</div>')+'</div>';
  }
  if(!r.exact.length&&!r.similar.length){
    out+='<div class="rcard none"><span class="rbadge">'+t('not_owned')+'</span><div class="nonebox"><div class="thumb" style="background:transparent;border:1px dashed var(--line)">'+bottle('other',0)+'</div><div><h3>'+esc(q)+'</h3><p class="muted">'+t('not_owned_sub')+'</p></div></div><div class="btns">'+wishBtn(q)+'</div></div>';
  }
  return out;
}
function buyView(){
  var tries=DEMO.map(function(d){return '<button class="fchip" data-a="try" data-v="'+esc(d)+'">'+esc(d)+'</button>';}).join('');
  var wl=S.wish.length?'<div class="wl">'+S.wish.map(function(w){return '<span class="w">'+esc(w)+'<button data-a="unwish" data-n="'+esc(w)+'" aria-label="'+t('remove')+'">'+ic('x')+'</button></span>';}).join('')+'</div>':'<p class="muted">'+t('wish_empty')+'</p>';
  return '<header><h1>'+t('buy_title')+'</h1><p class="sub">'+t('buy_sub')+'</p></header>'+
    '<div class="sbar"><label class="search">'+ic('search')+'<input id="bq" type="search" placeholder="'+esc(t('buy_ph'))+'" value="'+esc(S.buy.q)+'" autocomplete="off"></label>'+
    '<button class="iconbtn" data-a="buyscan" aria-label="'+t('scan_btn')+'">'+ic('scan')+'</button></div>'+
    '<div class="try"><span class="lbl">'+t('try_label')+'</span>'+tries+'</div>'+
    '<div class="res" id="res">'+resHTML()+'</div>'+
    '<section class="sec"><h2>'+t('wishlist')+'</h2>'+wl+'</section>';
}

var VIEWS={home:homeView,use:useView,add:addView,form:formView,details:detailsView,buy:buyView};

/* ---------- facilitator sheet: task timer and results ---------- */
var TASKS=['task1','task2','task3','task4','task5','task6'];
function tk(id){if(!S.tasks[id])S.tasks[id]={ms:0,run:false,t0:0,res:''};return S.tasks[id];}
function taskMs(id){var x=tk(id);return x.ms+(x.run?Date.now()-x.t0:0);}
function mmss(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function resultsText(){
  var lines=['Skincare Cabinet prototype · '+new Date().toLocaleString()];
  TASKS.forEach(function(id,n){
    var x=tk(id),res=x.res?t({done:'r_done',help:'r_help',gave:'r_gave'}[x.res]):'-';
    lines.push('T'+(n+1)+' · '+t(id)+' · '+mmss(taskMs(id))+' · '+res);
  });
  lines.push(t('st_added')+': '+S.stats.added);
  lines.push(t('st_checks')+': '+S.stats.checks);
  return lines.join('\n');
}
function renderSheet(){
  var el=$('#sheet');
  if(!S.fac){el.innerHTML='';return;}
  var rows=TASKS.map(function(id,n){
    var x=tk(id);
    return '<div class="task"><p><b>T'+(n+1)+'</b> · '+t(id)+'</p><div class="tctl">'+
      '<button class="tbtn'+(x.run?' run':'')+'" data-a="'+(x.run?'tstop':'tstart')+'" data-id="'+id+'">'+t(x.run?'t_stop':'t_start')+'</button>'+
      '<span class="tm" data-tm="'+id+'">'+mmss(taskMs(id))+'</span>'+
      ['done:r_done','help:r_help','gave:r_gave'].map(function(s){var a=s.split(':');return '<button class="tbtn" data-a="tres" data-id="'+id+'" data-v="'+a[0]+'" aria-pressed="'+(x.res===a[0])+'">'+t(a[1])+'</button>';}).join('')+
      '</div></div>';
  }).join('');
  el.innerHTML='<div class="sheet-bd" data-a="facclose"></div><div class="sheet" role="dialog" aria-label="'+t('fac')+'">'+
    '<div class="sh"><h2>'+t('fac')+'</h2><button class="iconbtn" data-a="facclose" aria-label="'+t('close')+'">'+ic('x')+'</button></div>'+
    '<p class="muted">'+t('fac_sub')+'</p>'+rows+
    '<div class="stats"><span>'+t('st_added')+' <b>'+S.stats.added+'</b></span><span>'+t('st_checks')+' <b>'+S.stats.checks+'</b></span></div>'+
    '<div class="actions"><button class="btn block" data-a="copyres">'+t('copy_res')+'</button><button class="btn ghost block" data-a="reset">'+t('reset')+'</button></div>'+
    (S.copyText?'<p class="muted">'+t('copy_fail')+'</p><textarea id="ctext" readonly>'+esc(S.copyText)+'</textarea>':'')+
    '</div>';
}
setInterval(function(){
  if(!S.fac)return;
  TASKS.forEach(function(id){if(tk(id).run){var el=document.querySelector('[data-tm="'+id+'"]');if(el)el.textContent=mmss(taskMs(id));}});
},500);

/* ---------- render + navigation ---------- */
function renderNav(){
  var items=[['home','cabinet','nav_home'],['add','plus','nav_add'],['use','use','nav_use'],['buy','bag','nav_buy']];
  $('#nav').innerHTML=items.map(function(x){
    return '<button data-a="tab" data-v="'+x[0]+'"'+(S.tab===x[0]?' aria-current="page"':'')+'><span class="ic">'+ic(x[1])+'</span>'+t(x[2])+'</button>';
  }).join('');
}
function renderOverlay(){
  var o=$('#ov');
  if(!S.scan){o.innerHTML='';return;}
  var bc=S.scan.kind==='barcode';
  o.innerHTML='<div class="ov" role="status"><div class="stack"><div class="frame '+(bc?'bc':'ph')+'"><div class="line"></div></div><div class="corners"></div></div><p>'+t(bc?'scanning_barcode':'scanning_photo')+'</p></div>';
}
function renderBar(){
  $('#pb-title').textContent=t('proto');
  $('#pb-fac').textContent=t('fac');
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===S.lang));});
  document.documentElement.lang=S.lang;
}
function render(keep){
  var sc=$('#screen'),top=keep?sc.scrollTop:0;
  sc.innerHTML=VIEWS[S.screen]();
  sc.scrollTop=top;
  renderNav();renderOverlay();renderBar();renderSheet();
}
function go(screen){S.hist.push(S.screen);S.screen=screen;S.confirmFinish=false;render(false);}
function tabTo(v){S.hist=[];S.tab=v;S.screen=v;S.confirmFinish=false;render(false);}
function back(){var s=S.hist.pop();S.screen=s||S.tab;S.confirmFinish=false;render(false);}
var toastTimer=null;
function toast(msg){
  var el=$('#toast');el.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.innerHTML='';},2200);
}

/* ---------- flows ---------- */
function startScan(kind,ctx){
  S.scan={kind:kind,ctx:ctx};renderOverlay();
  setTimeout(function(){
    S.scan=null;
    if(ctx==='add'){
      if(kind==='barcode'){
        S.scanCount++;
        /* every second barcode scan is "not found" so testers can see the fallback */
        S.form=(S.scanCount%2===1)
          ?blankForm({name:'Gentle Mineral Sunscreen',brand:'Verdana',size:'50 ml',cat:'sunscreen',pao:'12',banner:'found_banner'})
          :blankForm({banner:'notfound_banner'});
      }else{
        S.form=blankForm({name:'Overnight Repair Cream',brand:'Nórdica',size:'',cat:'moisturiser',pao:'6',uncertain:['size'],banner:'photo_banner'});
      }
      go('form');
    }else{
      S.buy.q=DEMO[S.buy.demo%DEMO.length];S.buy.demo++;S.stats.checks++;render(true);
    }
  },1400);
}
function saveForm(another){
  var f=S.form;
  if(!f.name.trim()){f.err=true;render(true);return;}
  var data={name:f.name.trim(),brand:f.brand.trim(),size:f.size.trim(),cat:f.cat||'other',status:f.status,
    opened:(f.status==='opened'&&!f.noOpened)?parseIso(f.opened):null,pao:f.pao?+f.pao:null,expiry:parseIso(f.expiry)};
  if(f.mode==='edit'){
    var p=byId(f.id);Object.assign(p,data);
    if(p.status==='unopened')p.left=null;else if(p.left==null)p.left=100;
    S.sel=p.id;S.hist=[S.tab];S.screen='details';toast(t('saved_toast'));
  }else{
    var np=mk(data);np.id='p'+Date.now();np.purchased=d0();np.left=np.status==='opened'?100:null;
    S.products.push(np);S.stats.added++;
    if(another){S.form=blankForm();toast(t('added_toast'));render(false);return;}
    S.sel=np.id;S.tab='home';S.hist=[];S.screen='details';toast(t('added_toast'));
  }
  S.form=null;render(false);
}
function resetAll(){
  S.products=seed();S.screen='home';S.tab='home';S.hist=[];S.sel=null;S.q='';S.brand='';S.view='list';S.form=null;
  S.buy={q:'',demo:0};S.wish=[];S.confirmFinish=false;S.scan=null;S.scanCount=0;
  S.tasks={};S.stats={added:0,checks:0};S.copyText='';S.fac=false;
  render(false);
}
function copyResults(){
  var txt=resultsText();
  function fail(){S.copyText=txt;renderSheet();}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){S.copyText='';renderSheet();toast(t('copied'));},fail);
    }else fail();
  }catch(e){fail();}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(!el)return;
  var a=el.dataset.a,v=el.dataset.v,id=el.dataset.id;
  if(S.scan)return;
  switch(a){
    case 'tab':tabTo(v);break;
    case 'back':back();break;
    case 'open':S.sel=id;go('details');break;
    case 'method':
      if(v==='manual'){S.form=blankForm();go('form');}
      else startScan(v==='scan'?'barcode':'photo','add');
      break;
    case 'fstatus':S.form.status=v;render(true);break;
    case 'fcat':S.form.cat=(S.form.cat===v?'':v);render(true);break;
    case 'clearform':S.form=blankForm();render(true);break;
    case 'save':saveForm(false);break;
    case 'saveanother':saveForm(true);break;
    case 'edit':{var p=byId(id||S.sel);if(p){S.sel=p.id;S.form=formFromProduct(p);go('form');}break;}
    case 'finish':S.confirmFinish=true;render(true);break;
    case 'cancelfinish':S.confirmFinish=false;render(true);break;
    case 'dofinish':
      S.products=S.products.filter(function(p){return p.id!==S.sel;});
      S.sel=null;S.confirmFinish=false;toast(t('finished_toast'));
      S.hist=[];S.screen=S.tab;render(false);break;
    case 'brand':S.brand=(S.brand===v?'':v);render(true);break;
    case 'view':S.view=v;render(true);break;
    case 'buyagain':{var bp=byId(S.sel);if(bp){S.buy.q=bp.name;tabTo('buy');}break;}
    case 'try':S.buy.q=v;S.stats.checks++;render(true);break;
    case 'buyscan':startScan('barcode','buy');break;
    case 'wish':if(S.wish.indexOf(el.dataset.n)<0)S.wish.push(el.dataset.n);toast(t('wish_toast'));render(true);break;
    case 'unwish':S.wish=S.wish.filter(function(w){return w!==el.dataset.n;});render(true);break;
    case 'lang':S.lang=v;render(true);break;
    case 'fac':S.fac=!S.fac;renderSheet();break;
    case 'facclose':S.fac=false;renderSheet();break;
    case 'tstart':
      TASKS.forEach(function(k){var x=tk(k);if(x.run){x.ms+=Date.now()-x.t0;x.run=false;}});
      tk(id).run=true;tk(id).t0=Date.now();renderSheet();break;
    case 'tstop':{var x=tk(id);if(x.run){x.ms+=Date.now()-x.t0;x.run=false;}renderSheet();break;}
    case 'tres':tk(id).res=(tk(id).res===v?'':v);renderSheet();break;
    case 'copyres':copyResults();break;
    case 'reset':resetAll();break;
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='q'){S.q=el.value;$('#list').innerHTML=listHTML();return;}
  if(el.id==='bq'){S.buy.q=el.value;$('#res').innerHTML=resHTML();return;}
  if(el.id==='rng'){
    var p=byId(S.sel);
    if(p){p.left=+el.value;$('#rngv').textContent=el.value+'%';$('#hb').innerHTML=bottle(p.cat,p.left);}
    return;
  }
  if(el.dataset&&el.dataset.f&&S.form){
    var f=el.dataset.f;
    if(el.type==='checkbox'){S.form.noOpened=el.checked;var od=$('#f-opened');if(od)od.disabled=el.checked;}
    else S.form[f]=el.value;
    if(f==='name'&&S.form.err&&el.value.trim()){S.form.err=false;}
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='f-pao'&&S.form)S.form.pao=el.value;
  if(el.id==='bq'&&el.value.trim().length>=3)S.stats.checks++;
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.fac){S.fac=false;renderSheet();}
});

resetAll();
})();
</script>
